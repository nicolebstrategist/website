<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  padding:0;
  background:#fbf3e6;
}

.email-wrapper {
  width:100%;
  background:#fbf3e6;
}

.email-container {
  width:100% !important;
  max-width:680px !important;
  margin:0 auto;
}

.email-body {
  background:#ffffff;
  padding:10px;
}

p {
  font-family: Arial, Helvetica, sans-serif;
  font-size:15px;
  line-height:1.75;
  color:#4d291a;
  margin:0 0 18px 0;
  text-align:justify;
}

h2 {
  font-family: Georgia, serif;
  font-size:26px;
  color:#f36a2e;
  margin:36px 0 12px 0;
  padding-top:36px;
  border-top:1px solid #f0e4d4;
}

h3 {
  font-family: Arial, Helvetica, sans-serif;
  font-size:18px;
  font-weight:700;
  color:#4d291a;
  margin:24px 0 6px 0;
}

a {
  color:#4d291a;
  text-decoration:none;
}

.email-highlight {
  background:#fbf3e6;
  border-left:3px solid #f36a2e;
  padding:20px;
  margin:24px 0;
}

.email-cta {
  display:inline-block;
  background:#f36a2e;
  color:#fff;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.18em;
  text-transform:uppercase;
  padding:12px 24px;
  border-radius:999px;
  text-decoration:none;
}

.email-divider {
  border:none;
  border-top:1px solid #f0e4d4;
  margin:36px 0;
}

.email-signature {
  text-align:center;
}

.email-signature-phrase {
  font-family: Georgia, serif;
  font-size:26px;
  font-style:italic;
  color:#f36a2e;
  margin:0 0 24px 0;
  text-align:center;
}

.email-signature-name {
  font-family: Arial, Helvetica, sans-serif;
  font-size:24px;
  font-weight:600;
  color:#4d291a;
  margin:10px 0 5px 0;
  text-align:center;
}

.email-signature-title {
  font-family: Arial, Helvetica, sans-serif;
  font-size:14px;
  color:#4d291a;
  opacity:0.7;
  text-align:center;
}

.email-footer {
  background:#f36a2e;
  padding:24px;
  text-align:center;
}

.email-footer p {
  font-size:12px;
  color:rgba(255,255,255,0.8);
  margin:0 0 6px 0;
  text-align:center;
}

.email-footer a {
  color:#fff;
}
</style>
</head>

<body>
<div class="email-wrapper">
<table class="email-container" cellpadding="0" cellspacing="0" width="100%" style="max-width:680px;">
<tr>
<td class="email-body">

<p style="font-family:Georgia,serif;font-size:20px;">Olá, {{ subscriber.first_name }},</p>

<p>Texto</p>

<div class="email-highlight">
<h3>Título</h3>

<p>Texto</p>

<p style="font-style:italic;opacity:0.6;">Subtexto</p>

<a href="https://www.nicolebadotti.com" class="email-cta">Botão</a>
</div>

<h2>h2</h2>

<h3>h3</h3>
<p>Texto</p>

<hr class="email-divider">

<div class="email-signature">
<p class="email-signature-phrase">Consciência é o primeiro passo.<br>Autorrespeito é o que transforma.</p>
<p class="email-signature-name">Nicole Badotti</p>
<p class="email-signature-title">Mentora de Saúde e Bem-Estar</p>
<p style="text-align:center;"><a href="https://www.nicolebadotti.com">www.nicolebadotti.com</a></p>
</div>

</td>
</tr>

<tr>
<td class="email-footer">
<p>Londres, Reino Unido</p>
<p>
<a href="{{ unsubscribe_url }}">Cancelar inscrição</a> |
<a href="{{ subscriber_preferences_url }}">Preferências</a>
</p>
</td>
</tr>
</table>
</div>
</body>
</html>
